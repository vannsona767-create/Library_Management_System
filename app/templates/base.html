<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Library Management System
        {% endblock %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <!-- Logo -->
            <a href="/home" class="logo">
                📚 Library
            </a>

            <!-- Navigation -->
            <div class="nav-links">

                <a href="/home">
                    Home
                </a>

                {% block navigation %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

                {% endblock %}

            </div>

        </nav>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            © 2026 Library Management System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
