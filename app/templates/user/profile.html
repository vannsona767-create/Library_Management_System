{% extends "base.html" %}

{% block title %}
My Profile | Library
{% endblock %}


{% block navigation %}

<a href="/profile">
    Profile
</a>

{% endblock %}


{% block content %}

<style>

    /* =========================
       PROFILE PAGE
       ========================= */

    .profile-page {
        max-width: 900px;
        margin: auto;
        padding: 60px 25px;
    }


    /* =========================
       PROFILE HEADER
       ========================= */

    .profile-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .profile-icon {
        width: 100px;
        height: 100px;

        margin: auto;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #e7dfd0;

        border-radius: 50%;

        font-size: 45px;
    }

    .profile-header h1 {
        margin: 20px 0 10px;

        font-size: 36px;
    }

    .profile-header p {
        color: #777;
    }


    /* =========================
       PROFILE INFORMATION
       ========================= */

    .profile-card {
        background-color: white;

        padding: 35px;

        border-radius: 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .profile-card h2 {
        margin-top: 0;

        margin-bottom: 25px;
    }


    /* Information Row */

    .profile-info {
        display: flex;

        justify-content: space-between;

        padding: 18px 0;

        border-bottom: 1px solid #eee;
    }

    .profile-info:last-child {
        border-bottom: none;
    }

    .info-label {
        font-weight: bold;

        color: #555;
    }

    .info-value {
        color: #333;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

        .profile-page {
            padding: 40px 20px;
        }

        .profile-card {
            padding: 25px;
        }

        .profile-info {
            flex-direction: column;

            gap: 5px;
        }

    }

</style>


<div class="profile-page">


    <!-- =========================
         PROFILE HEADER
         ========================= -->

    <section class="profile-header">

        <div class="profile-icon">
            👤
        </div>

        <h1>
            My Profile
        </h1>

        <p>
            Your library account information
        </p>

    </section>



    <!-- =========================
         PROFILE INFORMATION
         ========================= -->

    <section class="profile-card">

        <h2>
            Account Information
        </h2>


        <div class="profile-info">

            <span class="info-label">
                Name
            </span>

            <span class="info-value">
                {{ user.name }}
            </span>

        </div>


        <div class="profile-info">

            <span class="info-label">
                Email
            </span>

            <span class="info-value">
                {{ user.email }}
            </span>

        </div>


        <div class="profile-info">

            <span class="info-label">
                Role
            </span>

            <span class="info-value">
                {{ user.role }}
            </span>

        </div>


    </section>


</div>

{% endblock %}
